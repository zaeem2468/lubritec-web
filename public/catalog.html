<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Catalog | Lubritec</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030303;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        
        .text-brand-500 {
            color: #3b82f6;
        }
        
        .bg-brand-600 {
            background-color: #2563eb;
        }
        
        .bg-whatsapp {
            background-color: #25D366;
        }
        
        .glass-nav {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(-4px);
        }
        
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        
        #cart-sidebar {
            transform: translateX(100%);
            transition: transform 0.4s ease;
        }
        
        #cart-sidebar.open {
            transform: translateX(0);
        }
    </style>
</head>

<body class="antialiased">

    <!-- Ambient glowing orbs -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[60vw] md:w-[40vw] h-[60vw] md:h-[40vw] rounded-full bg-blue-600/10 blur-[100px] mix-blend-screen"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] md:w-[30vw] h-[50vw] md:h-[30vw] rounded-full bg-red-600/5 blur-[100px] mix-blend-screen"></div>
    </div>

    <nav class="fixed w-full z-50 glass-nav">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-8 md:px-12 h-24 md:h-32 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 sm:gap-3 md:gap-4 group">
                <div class="h-12 w-12 sm:h-16 sm:w-16 md:h-20 md:w-20 flex-shrink-0 transition-transform duration-300 flex items-center justify-center group-hover:scale-105">
                    <img src="image_7d531d.png" alt="Route 64 Logo" class="w-full h-full object-contain drop-shadow-lg" onerror="this.style.display='none'">
                </div>
                <span class="font-bold text-lg sm:text-2xl md:text-4xl tracking-wide uppercase text-white drop-shadow-md">LUBRICANTS</span>
            </a>
            <div class="flex items-center gap-6 md:gap-8">
                <button onclick="toggleCart()" class="relative p-2 transition flex items-center group bg-transparent border-none shadow-none">
                    <span class="text-xs uppercase font-normal px-3 text-white hidden sm:block tracking-widest">Basket</span>
                    <svg class="w-6 h-6 md:w-7 md:h-7 text-white group-hover:text-gray-300 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cart-count" class="absolute top-0 right-0 md:top-1 md:-right-1 bg-brand-red text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full scale-0 transition-transform">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full md:w-96 bg-[#050505] border-l border-gray-800 z-[70] flex flex-col h-full shadow-2xl">
        <div class="p-5 border-b border-gray-800 flex justify-between items-center bg-black">
            <div>
                <h3 class="font-bold text-lg uppercase tracking-widest">Your Quote</h3>
            </div>
            <button onclick="toggleCart()" class="p-2 bg-gray-800 rounded-full text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 pb-40">
            <div id="empty-cart-msg" class="h-full flex flex-col items-center justify-center text-gray-500 opacity-50">
                <p class="text-xs font-bold uppercase tracking-widest">Empty</p>
            </div>
        </div>
        <div class="absolute bottom-0 left-0 right-0 p-5 border-t border-gray-800 bg-black backdrop-blur-md">
            <div class="space-y-2 mb-5 text-sm">
                <div class="flex justify-between text-gray-400"><span>Subtotal</span><span id="cart-subtotal">R0.00</span></div>
                <div class="flex justify-between text-gray-400"><span>VAT (15%)</span><span id="cart-vat">R0.00</span></div>
                <div class="flex justify-between text-xl font-black pt-3 text-white border-t border-gray-800 mt-2"><span>Total</span><span id="cart-total" class="text-brand-500">R0.00</span></div>
            </div>
            <a id="wa-checkout-btn" href="#" class="w-full bg-whatsapp text-white font-bold uppercase tracking-widest py-4 rounded-xl flex justify-center items-center text-sm shadow-xl">Checkout</a>
        </div>
    </div>
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black bg-opacity-80 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity"></div>

    <section class="pt-32 md:pt-40 pb-20 px-4 bg-[#070707] min-h-screen relative z-10">
        <div class="max-w-7xl mx-auto relative">
            <div class="text-center mb-10">
                <h2 class="text-4xl font-black mb-2 uppercase tracking-tighter">Master Catalog</h2>
                <p class="text-gray-400 font-light">Select a product to view sizes and add to your quote.</p>
            </div>

            <div class="flex overflow-x-auto hide-scroll pb-4 mb-8 gap-3 border-b border-gray-800" id="filter-buttons">
                <button class="filter-btn active shrink-0 bg-brand-600 text-white px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest" data-filter="all">All Items</button>
                <button class="filter-btn shrink-0 glass-card text-gray-300 px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest" data-filter="Engine Oils">Engine Oils</button>
                <button class="filter-btn shrink-0 glass-card text-gray-300 px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest" data-filter="Gear & Auto">Gear Fluids</button>
                <button class="filter-btn shrink-0 glass-card text-gray-300 px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest" data-filter="Industrial">Industrial</button>
                <button class="filter-btn shrink-0 glass-card text-gray-300 px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest" data-filter="Chemicals & Grease">Chemicals</button>
            </div>

            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </section>

    <script src="data.js"></script>
    <script>
        const grid = document.getElementById('product-grid');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderCatalog(filterCategory = 'all') {
            grid.innerHTML = '';
            const filtered = filterCategory === 'all' ? products : products.filter(p => p.category === filterCategory);

            filtered.forEach(p => {
                const startPrice = p.variants[0].price.toFixed(2);

                // Clicking this card acts as a real link to the individual product page
                const card = document.createElement('a');
                card.href = `product.html?id=${p.id}`;
                card.className = 'glass-card p-6 md:p-8 rounded-2xl flex items-center justify-between cursor-pointer group block';

                card.innerHTML = `
                    <div class="flex-1 pr-4">
                        <span class="text-[10px] font-bold tracking-widest uppercase text-brand-500 mb-2 block">${p.category}</span>
                        <h3 class="text-lg md:text-xl font-bold text-white leading-tight group-hover:text-blue-400 transition-colors">${p.name}</h3>
                        <p class="text-xs text-gray-400 mt-2 font-medium">Starting from <span class="font-bold text-white">R${startPrice}</span></p>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-brand-600 bg-opacity-10 flex items-center justify-center text-brand-500 flex-shrink-0 border border-brand-500 border-opacity-20 group-hover:scale-110 group-hover:bg-brand-600 group-hover:text-white transition-all duration-300 shadow-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        renderCatalog();

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-brand-600', 'text-white', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]');
                    b.classList.add('glass-card', 'text-gray-300');
                });
                btn.classList.remove('glass-card', 'text-gray-300');
                btn.classList.add('bg-brand-600', 'text-white', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]');
                renderCatalog(btn.dataset.filter);
            });
        });
    </script>
</body>

</html>
