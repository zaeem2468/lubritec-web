<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="t">
  <title id="t">Route 64 pack sizes: 500 ml bottle, 5 L can, 20 L pail and 210 L drum</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#14245a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.35" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="pail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#991b1b"/>
      <stop offset="0.4" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.4" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#glow)"/>
  <g stroke="#3b82f6" stroke-opacity="0.12">
    <path d="M0 250h640M0 210h640M0 170h640M0 130h640M0 90h640M0 50h640"/>
    <path d="M80 0v320M160 0v320M240 0v320M320 0v320M400 0v320M480 0v320M560 0v320"/>
  </g>
  <ellipse cx="330" cy="286" rx="290" ry="16" fill="#000" opacity="0.4"/>

  <!-- 210 L drum -->
  <g>
    <rect x="405" y="66" width="176" height="218" rx="10" fill="url(#drum)"/>
    <rect x="399" y="60" width="188" height="14" rx="7" fill="#1e3a8a"/>
    <rect x="399" y="140" width="188" height="8" rx="4" fill="#1e3a8a" opacity="0.9"/>
    <rect x="399" y="212" width="188" height="8" rx="4" fill="#1e3a8a" opacity="0.9"/>
    <rect x="399" y="276" width="188" height="12" rx="6" fill="#172554"/>
    <circle cx="445" cy="67" r="6" fill="#93c5fd"/>
    <rect x="428" y="158" width="130" height="46" rx="8" fill="#0f172a"/>
    <text x="493" y="180" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" font-style="italic" text-anchor="middle">ROUTE 64</text>
    <text x="493" y="197" fill="#60a5fa" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">210 L</text>
  </g>

  <!-- 20 L pail -->
  <g>
    <path d="M300 138c8-34 92-34 100 0" fill="none" stroke="#cbd5e1" stroke-width="4"/>
    <path d="M288 140h124l-9 142a6 6 0 0 1-6 5h-94a6 6 0 0 1-6-5z" fill="url(#pail)"/>
    <rect x="284" y="134" width="132" height="12" rx="5" fill="#7f1d1d"/>
    <rect x="304" y="196" width="92" height="38" rx="6" fill="#fff"/>
    <text x="350" y="214" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" font-style="italic" text-anchor="middle">ROUTE 64</text>
    <text x="350" y="228" fill="#ef4444" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">20 L</text>
  </g>

  <!-- 5 L can -->
  <g>
    <path d="M184 176h46v-14h20v14h4a10 10 0 0 1 10 10v94a6 6 0 0 1-6 6h-78a6 6 0 0 1-6-6v-94a10 10 0 0 1 10-10z" fill="url(#can)"/>
    <rect x="232" y="156" width="16" height="8" rx="2" fill="#2563eb"/>
    <rect x="174" y="214" width="90" height="34" rx="4" fill="#2563eb"/>
    <text x="219" y="231" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" font-style="italic" text-anchor="middle">ROUTE 64</text>
    <text x="219" y="243" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">5 L</text>
  </g>

  <!-- 500 ml bottle -->
  <g>
    <rect x="113" y="200" width="16" height="12" rx="2" fill="#ef4444"/>
    <path d="M114 212h14v10l12 14v46a5 5 0 0 1-5 5h-28a5 5 0 0 1-5-5v-46l12-14z" fill="url(#bottle)"/>
    <rect x="102" y="246" width="38" height="24" rx="3" fill="#0f172a"/>
    <text x="121" y="262" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="900" text-anchor="middle">500 ml</text>
  </g>
</svg>
